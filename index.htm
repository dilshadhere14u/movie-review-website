<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Review Hub</title>
<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    background: #121212;
    color: #fff;
}
header {
    background: #1f1f1f;
    text-align: center;
    padding: 20px;
    font-size: 2em;
    font-weight: bold;
}
.search-container {
    display: flex;
    justify-content: center;
    padding: 15px;
}
.search-container input {
    width: 300px;
    padding: 10px;
    border-radius: 5px 0 0 5px;
    border: none;
    outline: none;
}
.search-container button {
    padding: 10px 15px;
    border: none;
    background: #ff3d00;
    color: #fff;
    cursor: pointer;
    border-radius: 0 5px 5px 0;
    font-weight: bold;
}
nav, .category-filter {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    padding: 10px 0;
}
nav button {
    background: #ff3d00;
    color: #fff;
    border: none;
    margin: 5px;
    padding: 10px 20px;
    cursor: pointer;
    border-radius: 5px;
    font-weight: bold;
    transition: 0.3s;
}
nav button:hover { background: #e63600; }
.category-filter button {
    background: #00bcd4;
    margin: 5px;
}
.category-filter button:hover { background: #0097a7; }
.movies {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    padding: 20px;
}
.movie-card {
    background: #1f1f1f;
    border-radius: 10px;
    overflow: hidden;
    transition: transform 0.3s, box-shadow 0.3s;
    position: relative;
}
.movie-card:hover {
    transform: scale(1.05);
    box-shadow: 0 10px 20px rgba(255,255,255,0.2);
}
.movie-card img {
    width: 100%;
    height: 330px;
    object-fit: cover;
}
.movie-info {
    padding: 10px;
}
.movie-info h3 {
    margin: 0 0 5px 0;
    font-size: 1.1em;
}
.movie-info p {
    margin: 3px 0;
    font-size: 0.9em;
}
.stars {
    color: gold;
    font-size: 1em;
}
@media (max-width: 600px) {
    .search-container input { width: 70%; }
}
</style>
</head>

let selectedIndustry = 'All';
let selectedCategory = 'All';
let searchQuery = '';

function displayMovies(movieList) {
    const container = document.getElementById('moviesContainer');
    container.innerHTML = '';
    if(movieList.length === 0) {
        container.innerHTML = `<p style="text-align:center;">No movies found.</p>`;
        return;
    }
    movieList.forEach(movie => {
        const starsCount = Math.round((movie.rating/10)*5);
        let stars = '';
        for(let i=0;i<5;i++){
            stars += i < starsCount ? '★' : '☆';
        }
        const card = document.createElement('div');
        card.classList.add('movie-card');
        card.innerHTML = `
            <img src="${movie.poster || 'https://via.placeholder.com/200x330?text=No+Image'}" alt="${movie.title}">
            <div class="movie-info">
                <h3>${movie.title} (${movie.year})</h3>
                <p><strong>Industry:</strong> ${movie.industry}</p>
                <p><strong>Category:</strong> ${movie.category}</p>
                <p><strong>Rating:</strong> ${movie.rating} <span class="stars">${stars}</span> (${movie.votes})</p>
                <p><strong>Duration:</strong> ${movie.duration}</p>
            </div>
        `;
        container.appendChild(card);
    });
}

function filterIndustry(industry){
    selectedIndustry = industry;
    selectedCategory = 'All';
    document.getElementById('searchInput').value = '';
    searchQuery = '';
    displayCategoryButtons();
    filterMovies();
}

function filterCategory(category){
    selectedCategory = category;
    filterMovies();
}

function displayCategoryButtons(){
    const categoryNav = document.getElementById('categoryNav');
    categoryNav.innerHTML = '';
    let filteredMovies = selectedIndustry === 'All' ? movies : movies.filter(m=>m.industry===selectedIndustry);
    const categories = [...new Set(filteredMovies.map(m=>m.category))];
    categories.forEach(cat=>{
        const btn = document.createElement('button');
        btn.textContent = cat;
        btn.onclick = ()=>filterCategory(cat);
        categoryNav.appendChild(btn);
    });
    if(categories.length>0){
        const allBtn = document.createElement('button');
        allBtn.textContent = 'All';
        allBtn.onclick = ()=>filterCategory('All');
        categoryNav.insertBefore(allBtn,categoryNav.firstChild);
    }
}

function searchMovies(){
    searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
    filterMovies();
}

function filterMovies(){
    let filtered = movies;
    if(selectedIndustry !== 'All') filtered = filtered.filter(m=>m.industry===selectedIndustry);
    if(selectedCategory !== 'All') filtered = filtered.filter(m=>m.category===selectedCategory);
    if(searchQuery !== '') filtered = filtered.filter(m=>m.title.toLowerCase().includes(searchQuery));
    displayMovies(filtered);
}

// Initial display
displayCategoryButtons();
filterMovies();
